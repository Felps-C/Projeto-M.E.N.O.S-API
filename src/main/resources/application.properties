spring.application.name=demo

# Banco (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/menos?createDatabaseIfNotExist=true&serverTimezone=America/Bahia
spring.datasource.username=root
# Usa a variável de ambiente DB_PASSWORD se existir; se não, o valor depois dos dois pontos (só para o seu computador).
spring.datasource.password=${DB_PASSWORD:root}

# Cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Upload de imagens da merenda (padrão é 1 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Faz as mensagens de erro (404, 409, validações...) chegarem no JSON, para o front mostrar ao usuário.
server.error.include-message=always
server.error.include-binding-errors=always

# Sites (front-end) que podem chamar esta API. Separe vários por vírgula.
# Em produção, coloque o endereço real do site: menos.cors.origens=https://menos.seudominio.com
menos.cors.origens=*

# Login com token (JWT). Em produção, defina a variável de ambiente MENOS_JWT_SEGREDO com pelo menos 32 caracteres
# aleatórios. Sem ela, um segredo temporário é gerado a cada início (os logins caem ao reiniciar o servidor).
menos.jwt.segredo=${MENOS_JWT_SEGREDO:}
# Quantas horas o login vale
menos.jwt.horas=12
