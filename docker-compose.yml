# Sobe o banco (MySQL), a API (Spring) e o túnel que dá um endereço público para a API.
# O front-end fica na Vercel e conversa com a API por esse endereço.
name: menos

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
      MYSQL_DATABASE: menos
      TZ: America/Bahia
    volumes:
      - db_data:/var/lib/mysql          # os dados ficam guardados aqui, mesmo se o container for recriado
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  back:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"           # só este computador acessa direto; o mundo entra pelo túnel
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/menos?createDatabaseIfNotExist=true&serverTimezone=America/Bahia
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      MENOS_JWT_SEGREDO: ${MENOS_JWT_SEGREDO:?defina MENOS_JWT_SEGREDO no arquivo .env (32+ caracteres)}
      MENOS_CORS_ORIGENS: ${SITE_URL:?defina SITE_URL no arquivo .env (endereço do site na Vercel)}

  tunel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://back:8080
    depends_on:
      - back

volumes:
  db_data:
